<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Mira. Your camera, your moment. Photos stay on your device." />
    <title>Mira — camera</title>
    <link rel="icon" href="./assets/mark.svg" type="image/svg+xml" />
    <link rel="preload" href="./assets/manrope.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <main class="camera-app" aria-label="Mira camera">
      <section class="viewfinder" id="viewfinder" aria-label="Camera preview">
        <video id="camera-video" class="camera-video" autoplay playsinline muted hidden aria-label="Live camera preview"></video>
        <div class="preview-shade" aria-hidden="true"></div>
        <span class="flash-status" role="img" aria-label="Flash off"><span data-icon="flash-off"></span></span>
        <span class="sr-only" id="status-label" role="status">Camera is off</span>
        <div class="camera-request" id="camera-request">
          <span class="request-icon" data-icon="camera"></span>
          <h1 id="request-title">Open your camera</h1>
          <p id="request-description">Allow camera access to see yourself here.</p>
          <button class="enable-button" id="enable-camera" type="button">Enable camera</button>
        </div>
        <div class="capture-flash" id="capture-flash" aria-hidden="true"></div>
      </section>
      <div class="control-dock">
        <div class="effects-label"><span data-icon="sparkles"></span><span>Effects</span></div>
        <div class="look-tray">
          <div class="look-selector" role="radiogroup" aria-label="Choose your look">
            <button class="look-choice" type="button" role="radio" aria-checked="false" tabindex="-1" data-look="Daylight" data-position="left" aria-label="Daylight"><span class="look-swatch daylight-swatch"><span data-icon="sun"></span></span></button>
            <button class="look-choice is-selected" type="button" role="radio" aria-checked="true" tabindex="0" data-look="Rosé" data-position="center" aria-label="Rosé"><span class="look-swatch rose-swatch"><span class="flower-symbol" aria-hidden="true">✿</span></span></button>
            <button class="look-choice" type="button" role="radio" aria-checked="false" tabindex="-1" data-look="Midnight" data-position="right" aria-label="Midnight"><span class="look-swatch midnight-swatch"><span data-icon="moon"></span><span class="swatch-star" aria-hidden="true">✧</span></span></button>
          </div>
          <button class="shutter-button" id="shutter-button" type="button" aria-label="Take photo" disabled></button>
        </div>
      </div>
      <nav class="bottom-controls" aria-label="Camera controls">
        <button class="icon-button gallery-button" id="gallery-button" type="button" aria-label="Open your photos"><span class="gallery-thumbnail" id="gallery-thumbnail"><span data-icon="image"></span></span><span class="photo-count" id="photo-count" hidden></span></button>
        <div class="current-look" aria-live="polite"><span id="current-look-label">Rosé</span><span class="name-sparkle" aria-hidden="true">✨</span></div>
        <button class="icon-button flip-button" id="flip-button" type="button" aria-label="Switch between front and rear camera" disabled><span data-icon="flip"></span></button>
      </nav>
    </main>
    <dialog class="gallery-modal" id="gallery-dialog" aria-labelledby="gallery-title">
      <div class="modal-heading"><h2 id="gallery-title">Your photos</h2><button class="icon-button" type="button" data-close aria-label="Close your photos"><span data-icon="close"></span></button></div>
      <div class="gallery-empty" id="gallery-empty"><span data-icon="image"></span><p>Your photos will appear here.</p></div>
      <div class="gallery-grid" id="gallery-grid"></div>
      <p class="gallery-footnote">Photos stay on your device for this visit. Download the ones you want to keep.</p>
    </dialog>
    <div class="toast" id="toast" role="status" hidden></div>
  </body>
</html>
